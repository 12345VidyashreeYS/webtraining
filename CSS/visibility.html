<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .container{
            background-color: lightblue;
            border: 1px solid black;
            /* position: relative; */
            height: 100px;
            width: 100px;
        }

        .box1{
            visibility: visible;
        }

        .box2{
            visibility: hidden;
        }

        .box3{
            visibility: collapse;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
    </div>
</body>
</html>
