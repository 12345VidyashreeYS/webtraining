<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: rgb(53, 8, 8);
            border: 2px, solid rgb(17, 17, 17);
            display: inline-block;
        }

        .box2{
            height: 100px;
            width: 100px;
            background-color: rgb(241, 9, 9);
            border: 2px, solid rgb(250, 8, 8);
            display: inline-block;
        }

        #p1{
            display: inline;
            background-color: yellow;    
        }

        #p2{
            display: inline-block;
            background-color: red;    
        }
        
    </style>
</head>
<body>
    <div></div>
    <div class="box2"></div>
    <p id="p1">Hi</p><p id="p2">Bye</p>

</body>
</html>
